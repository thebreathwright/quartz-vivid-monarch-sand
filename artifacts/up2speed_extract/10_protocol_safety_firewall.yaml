# Protocol Safety Firewall for Respiratory Adaptation Canon
# version: 0.2.0-seed
# created_utc: 2026-05-27T19:05:10Z
# purpose: Gate protocol-like material before public rendering while preserving raw source material.

firewall:
  name: protocol_safety_firewall
  applies_to:
    - protocol_source
    - intervention_claim
    - public_explainer
    - trainee_packet
    - any_generated_steps
  governing_rule: >
    Raw archive material may be preserved, but public-facing protocol instructions must be safety-translated.
    High-risk material should be rendered as history, hypothesis, supervised-pilot design, or non-combustion analogue,
    not as unsupervised public instruction.

claim_rendering_levels:
  historical_or_symbolic:
    allowed: true
    description: Discuss as history, metaphor, symbolic mapping, or archive provenance.
  hypothesis_only:
    allowed: true
    description: Present as research hypothesis without instructing performance.
  supervised_pilot_only:
    allowed: true
    description: Present as protocol concept only under clinician/research supervision, ethics review, monitoring, and stop rules.
  non_combustion_analogue:
    allowed: true
    description: Replace smoke/combustion/vaping/aerosol irritant language with clean-air, humidity, temperature, flow, or pressure analogues.
  public_instruction:
    allowed_by_default: false
    description: Only low-risk, non-apneic, clean-air, non-water, non-driving, non-pregnancy, non-pediatric, non-extreme-pressure instructions may be rendered.

absolute_public_blocks:
  - id: no_breathwork_in_water
    rule: Do not provide instructions for breathwork in water or near water.
    action: block_as_public_instruction
  - id: no_breathwork_while_driving_or_operating_tools
    rule: Do not provide instructions for breathwork while driving, operating machinery, cooking, climbing, bathing, swimming, or using tools.
    action: block_as_public_instruction
  - id: no_extreme_pressure_public_steps
    rule: Do not provide unsupervised public steps for extreme Valsalva-like pressure, pass-out-seeking, or high-pressure breath holds.
    action: allow_as_supervised_pilot_only
  - id: no_pediatric_protocol_instruction
    rule: Do not provide pediatric airway manipulation or breath-holding protocols as public instruction.
    action: allow_as_hypothesis_only_or_clinical_research

risk_flags:
  breath_holding:
    description: Apneic holds, empty-lung holds, full-lung holds, hyperventilation followed by hold.
    default_action: supervised_pilot_only
    public_translation: discuss as CO2/O2 tolerance research; avoid stepwise unsupervised protocols.
  water_proximity:
    description: Any breathwork around bath, pool, lake, ocean, shower, sauna plunge, or drowning-risk setting.
    default_action: block_as_public_instruction
  driving_or_tools:
    description: Any breathwork while attention, balance, consciousness, or coordination is required.
    default_action: block_as_public_instruction
  smoke_or_combustion:
    description: Cigarette, cigar, cannabis, mullein, incense, vape, THC/CBD/nicotine aerosol, combustion products.
    default_action: rewrite_as_non_combustion_analogue
  pregnancy:
    description: Maternal-fetal claims or interventions.
    default_action: hypothesis_only
  pediatric_use:
    description: Infants, children, adolescents, schools, parent-administered protocols.
    default_action: supervised_pilot_only_or_block_public_instruction
  extreme_pressure:
    description: Hard Valsalva, intrapharyngeal pressurization, throat inflation, fainting risk, high-pressure straining.
    default_action: supervised_pilot_only
  severe_OSA:
    description: Known/suspected severe obstructive sleep apnea, significant desaturation, CPAP dependence, daytime sleepiness.
    default_action: medical_evaluation_required
  cardiovascular_risk:
    description: Hypertension, arrhythmia, aneurysm risk, syncope history, stroke/TIA history, heart disease.
    default_action: medical_evaluation_required
  respiratory_disease:
    description: Asthma, COPD, cystic fibrosis, bronchiectasis, active infection, hemoptysis.
    default_action: medical_evaluation_required
  neurologic_or_syncope_risk:
    description: Seizure, fainting, vestibular instability, concussion recovery.
    default_action: medical_evaluation_required

measurement_thresholds:
  SpO2:
    use_case: screening_and_stop_rule_only_not_diagnosis
    repeat_check_below_percent: 92
    hard_stop_below_percent: 90
    urgent_medical_evaluation_below_percent: 88
    note: Pulse oximetry is useful but incomplete; it does not measure ventilation, CO2, sleep architecture, or cause.
  AHI_or_RDI_adult:
    normal_lt: 5
    mild_gte: 5
    moderate_gte: 15
    severe_gte: 30
    gate: Known or suspected moderate/severe OSA requires medical evaluation before protocol rendering.
  PNIF_internal:
    caution_drop_from_7day_personal_baseline_percent: 20
    hard_stop_drop_from_7day_personal_baseline_percent: 30
    caution_if_below_percent_of_personal_best: 80
    note: Use personal baseline and repeated trials; avoid universal-normality claims.
  symptoms_hard_stop:
    - chest_pain
    - fainting_or_near_fainting
    - blue_lips_or_confusion
    - severe_headache_or_neurologic_symptoms
    - wheezing_or_bronchospasm
    - coughing_blood
    - persistent_voice_or_throat_pain
    - prolonged_dizziness
    - severe_shortness_of_breath
    - new_or_worsening_palpitations

safe_public_defaults:
  framing:
    - self_assessment_not_diagnosis
    - training_hypothesis_not_cure_claim
    - individual_thresholds_not_universal_stimulus_thresholds
    - progressive_overload_with_recovery_not_max_force_always
  permitted_low_risk_public_topics:
    - measurement_logging
    - nasal_route_awareness
    - non-apneic_slow_nasal_breathing_practice
    - sleep_notes_and_spo2_report_interpretation_limits
    - clinician_discussion_prompts
    - clean-air_humidity_temperature_research_design
    - symbolic_or_historical_discussion
  prohibited_public_claim_styles:
    - universal_cure
    - near_100_percent_response_without_evidence
    - replacement_for_prescribed_cpap_or_oxygen_without_clinician
    - blame_language_for_pregnancy_or_sleep_apnea
    - instruction_to_continue_until_pain_or_fainting

protocol_render_gates:
  protocol_source:
    requires:
      - risk_flag_scan
      - claim_level_assignment
      - contraindication_table
      - measurement_plan
      - stop_rules
      - public_rendering_rule
  supervised_pilot_only:
    requires:
      - ethics_or_clinical_supervision
      - inclusion_exclusion_criteria
      - adverse_event_reporting
      - baseline_measurements
      - followup_measurements
      - conservative_progression
  non_combustion_analogue:
    replacements:
      smoke_or_vape: clean_warm_humidified_air_or_controlled_humidity_temperature_challenge
      chemical_irritant: medically_approved_nebulized_saline_or_research_aerosol_under_protocol
      sauna_hyperventilation: non-apneic_controlled_climate_exposure_with_supervision_and_stop_rules

language_policy:
  self_assessment_only: true
  no_diagnosis_language: true
  no_public_medical_advice_override: true
  preserve_raw_archive_voice: true
  canonical_science_rewrite_must:
    - remove_or_label_rhetorical_escalation
    - tag claim_strength
    - cite or mark as internal/model/speculative
    - include safety gate for protocols

output_actions:
  allow_as_historical_or_symbolic: "Symbolic, historical, or comparative discussion; no steps."
  allow_as_hypothesis_only: "Research hypothesis, variables, measurements, and open questions; no self-treatment instruction."
  allow_as_supervised_pilot_only: "Bounded study design with oversight and stop rules."
  rewrite_as_non_combustion_analogue: "Replace harmful carrier/exposure with clean-air/humidity/temperature/flow analogue."
  block_as_public_instruction: "Do not render as actionable public steps."
